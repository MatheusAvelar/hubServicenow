<section class="dl-card" aria-labelledby="dl-ranking-title">
    <h2 class="dl-card-title" id="dl-ranking-title">
        <span>Ranking</span>
        <button type="button" class="dl-btn dl-btn-secondary" ng-click="c.exportCsv()" ng-disabled="c.exporting">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>
            {{c.exporting ? 'Gerando…' : 'Exportar CSV'}}
        </button>
    </h2>
    <div class="dl-alert dl-alert-error" ng-if="data.error || c.message" role="alert">{{data.error || c.message}}</div>
    <p class="dl-empty" ng-if="!data.error && data.rows.length === 0">Nenhum participante ativo ainda.</p>
    <div class="dl-scroll" ng-if="data.rows.length > 0">
        <table class="dl-table">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Dev</th>
                    <th scope="col">Pontos</th>
                    <th scope="col">Concluídas</th>
                    <th scope="col">Progresso</th>
                    <th scope="col">Última sincronização</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="row in data.rows track by row.participant">
                    <td class="dl-mono">{{row.position}}º</td>
                    <td>
                        <span class="dl-rank-dev">
                            <span class="dl-avatar" aria-hidden="true">{{row.initials}}</span>
                            <span>{{row.name}}</span>
                        </span>
                    </td>
                    <td class="dl-mono dl-rank-points">{{row.points}}</td>
                    <td class="dl-mono">{{row.completed}} de {{row.total}}</td>
                    <td>
                        <div class="dl-bar" role="img" aria-label="{{row.progress}}% concluído">
                            <span ng-style="{width: row.progress + '%'}"></span>
                        </div>
                    </td>
                    <td class="dl-rank-seen">
                        <span>{{row.last_seen_label}}</span>
                        <span class="dl-badge dl-badge-warn" ng-if="row.inactive">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                                aria-hidden="true"><path d="M12 7v6M12 17h.01"></path></svg>
                            Inativo
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
