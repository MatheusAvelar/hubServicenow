<section class="dl-card" aria-labelledby="dl-awaiting-title">
    <h2 class="dl-card-title" id="dl-awaiting-title">
        <span>Aguardando aprovação</span>
    </h2>
    <div class="dl-alert dl-alert-error" ng-if="data.error" role="alert">{{data.error}}</div>
    <p class="dl-empty" ng-if="!data.error && !data.result.activity">Nenhuma atividade publicada.</p>
    <div ng-if="data.result.activity">
        <p class="dl-awaiting-activity">
            <span class="dl-mono">{{data.result.activity.number}}</span> · {{data.result.activity.title}}
            <span class="dl-card-sub" ng-if="data.result.activity.published_label">Publicada {{data.result.activity.published_label}}</span>
        </p>
        <p class="dl-empty" ng-if="data.result.devs.length === 0">
            <span class="dl-badge dl-badge-done">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
                Todos aprovaram
            </span>
        </p>
        <ul class="dl-awaiting-list" ng-if="data.result.devs.length > 0">
            <li ng-repeat="dev in data.result.devs track by $index">
                <span class="dl-avatar" aria-hidden="true">{{dev.initials}}</span>
                <span class="dl-awaiting-name">{{dev.name}}</span>
                <span class="dl-muted dl-awaiting-seen">sincronizou {{dev.last_seen_label}}</span>
            </li>
        </ul>
    </div>
</section>
